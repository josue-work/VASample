name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: VASampleTests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The project is Xcode 27 format (objectVersion 110) and the test
      # targets need an iOS 27 simulator, so pick the newest Xcode 27 on the runner.
      - name: Select Xcode 27
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 27 found on this runner. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Pick an iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted(
              (k for k in runtimes if ".SimRuntime.iOS-" in k and runtimes[k]),
              key=lambda k: [int(p) for p in k.rsplit("iOS-", 1)[1].split("-")],
          )
          for runtime in reversed(ios):
              for device in runtimes[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit()
          ')
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator available"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project VASample.xcodeproj \
            -scheme VASample \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:VASampleTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
          retention-days: 7
